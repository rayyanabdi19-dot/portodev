name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR to streamline builds and save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Automated Testing, Linting & Type Validation
  # -------------------------------------------------------------
  test-and-lint:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type checking & Linting
        run: npm run lint

      - name: Run automated test suite
        run: npm test

  # -------------------------------------------------------------
  # Job 2: Streamlined Application Build
  # -------------------------------------------------------------
  build:
    name: Build Application
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build client & server bundles
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build artifacts
        run: |
          echo "Verifying build outputs in dist/..."
          test -f dist/index.html || { echo "dist/index.html is missing!"; exit 1; }
          test -f dist/server.cjs || { echo "dist/server.cjs is missing!"; exit 1; }
          echo "✓ All build assets generated successfully."
          ls -lah dist/

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # -------------------------------------------------------------
  # Job 3: Automated Deployment
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Production
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dist
          path: dist/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "The Delv Andriawan Portfolio has been built, tested, and deployed successfully." >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: \`production\`" >> $GITHUB_STEP_SUMMARY
